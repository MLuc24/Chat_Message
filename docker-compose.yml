services:
  # ==================== GATEWAY ====================
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: messenger-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      NODE_ENV: production
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      CHAT_SERVICE_URL: http://chat-service:3003
      REALTIME_SERVICE_URL: http://realtime-service:9000
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      - auth-service
      - user-service
      - chat-service
      - realtime-service
    networks:
      - messenger-network
    restart: unless-stopped

  # ==================== AUTH SERVICE ====================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: messenger-auth-service
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/messenger_auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 10
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - messenger-network
    restart: unless-stopped

  # ==================== USER SERVICE ====================
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: messenger-user-service
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/messenger_user
      REDIS_URL: redis://redis:6379
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - messenger-network
    restart: unless-stopped

  # ==================== CHAT SERVICE ====================
  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    container_name: messenger-chat-service
    environment:
      PORT: 3003
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/messenger_chat
      REDIS_URL: redis://redis:6379
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - messenger-network
    restart: unless-stopped

  # ==================== REALTIME SERVICE ====================
  realtime-service:
    build:
      context: ./services/realtime-service
      dockerfile: Dockerfile
    container_name: messenger-realtime-service
    ports:
      - "9000:9000"
    environment:
      PORT: 9000
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:3002
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - messenger-network
    restart: unless-stopped

  # ==================== POSTGRESQL ====================
  postgres:
    image: postgres:15-alpine
    container_name: messenger-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: messenger_auth,messenger_user,messenger_chat
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messenger-network
    restart: unless-stopped

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: messenger-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - messenger-network
    restart: unless-stopped

  # ==================== NGINX (Optional) ====================
  # nginx:
  #   image: nginx:alpine
  #   container_name: messenger-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - gateway
  #   networks:
  #     - messenger-network
  #   restart: unless-stopped

networks:
  messenger-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
