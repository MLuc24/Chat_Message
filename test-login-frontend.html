<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - Frontend Fix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        .success { color: green; }
        .error { color: red; }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Test Login - Frontend Response Structure</h1>
    
    <div class="test-section">
        <h2>Test Login with Seeded User</h2>
        <button onclick="testLogin()">Test Login (edward@example.com)</button>
        <div id="login-result"></div>
    </div>

    <div class="test-section">
        <h2>Response Structure</h2>
        <pre id="response-structure"></pre>
    </div>

    <script>
        const API_URL = 'http://localhost:3001';

        async function testLogin() {
            const resultDiv = document.getElementById('login-result');
            const structureDiv = document.getElementById('response-structure');
            
            resultDiv.innerHTML = '<p>Testing login...</p>';
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'edward@example.com',
                        password: 'password123'
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <p class="success">✅ Login successful!</p>
                        <p>User: ${data.user.name} (${data.user.email})</p>
                        <p>Access Token: ${data.tokens.accessToken.substring(0, 50)}...</p>
                        <p>Refresh Token: ${data.tokens.refreshToken.substring(0, 50)}...</p>
                    `;
                    
                    structureDiv.textContent = JSON.stringify(data, null, 2);
                } else {
                    resultDiv.innerHTML = `
                        <p class="error">❌ Login failed!</p>
                        <p>Status: ${response.status}</p>
                        <p>Message: ${data.message || 'Unknown error'}</p>
                    `;
                    structureDiv.textContent = JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Error: ${error.message}</p>
                `;
                structureDiv.textContent = error.stack;
            }
        }

        // Auto-test on load
        window.onload = () => {
            console.log('Page loaded. Click button to test login.');
        };
    </script>
</body>
</html>
